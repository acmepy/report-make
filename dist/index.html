<!doctype html>
<html lang="es">

  <head>

  <body>
    <div id="app">
      <div id="toolbar">
        <div id="toolbar-title">
          <span class="app-name">Report Make</span>
          <span id="app-version" class="app-version">v1.0.0</span>
        </div>
        <div class="toolbar-group" role="group" aria-label="Plantillas">
          <select id="templates" aria-label="Plantilla" title="Seleccionar plantilla"></select>
          <select id="actions" aria-label="Acciones de plantilla" title="Acciones de plantilla">
            <option value="">Acciones</option>
            <option value="copy">Copiar</option>
            <option value="rename">Renombrar</option>
            <option value="delete">Eliminar</option>
          </select>
        </div>
        <div class="toolbar-group" role="group" aria-label="Generación y sincronización">
          <button id="btnGenerar" class="icon-button" type="button" title="Generar PDF" aria-label="Generar PDF">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13 3H5v18h14V9z M13 3v6h6"/><path d="m9 12 5 3-5 3z"/></svg>
          </button>
          <button id="save" class="icon-button" type="button" title="Guardar en servidor (Ctrl+S / Cmd+S)" aria-label="Guardar en servidor">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg>
          </button>
          <button id="download" class="icon-button" type="button" title="Descargar del servidor" aria-label="Descargar del servidor">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v13m-5-5 5 5 5-5M4 15v6h16v-6"/></svg>
          </button>
        </div>
        <span id="sync-status" role="status"></span>
      </div>

      <div id="workspace">
        <div id="editing">
          <div id="editor-tabs">
            <button id="code-tab" aria-pressed="true">Código</button>
            <button id="data-tab" aria-pressed="false">Datos de prueba</button>
            <button id="format-json" type="button" hidden>Formatear JSON</button>
          </div>
          <div id="editor"></div>
          <div id="data-editor" hidden></div>
        </div>
        <div
          id="workspace-divider"
          role="separator"
          aria-label="Redimensionar editor y visor"
          aria-orientation="vertical"
          aria-valuemin="20"
          aria-valuemax="80"
          aria-valuenow="45"
          tabindex="0"></div>
        <div id="preview-column">
          <iframe id="viewer"></iframe>
          <div
            id="console-divider"
            role="separator"
            aria-label="Redimensionar visor y consola"
            aria-orientation="horizontal"
            aria-valuemin="96"
            aria-valuemax="70"
            aria-valuenow="180"
            tabindex="0"></div>
          <section id="console-panel" aria-label="Salida de consola">
            <div id="console-header">
              <span>Consola</span>
              <button id="btnLimpiarConsola" type="button">Limpiar</button>
            </div>
            <pre id="console-output" aria-live="polite"></pre>
          </section>
        </div>
      </div>
    </div>
